# Hooks use the project venv and binaries already installed on the server.
# They run inside a Slurm job (`sbatch --wait slurm/gate.sh hooks`), not as a
# git hook on the login node: mypy there would break the server's rules.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: gitleaks
        name: gitleaks
        entry: bash -c 'command -v gitleaks >/dev/null || { echo "gitleaks not installed"; exit 0; }; gitleaks detect --source . --no-banner --redact'
        language: system
        pass_filenames: false
