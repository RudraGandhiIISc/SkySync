# Optional mirror. The gate that counts is `slurm/gate.sh all` on the CSA
# server; this runs the hermetic checks if the repo is pushed to GitHub.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: make fmt-check lint type test
