# The nine PRD models (FR-8). ASKIISC_MODEL selects one by key.
# served_name is what vLLM is started with (--served-model-name) and what the
# client sends; hf_repo is what slurm/fetch_models.sh downloads.
# AWQ entries point at our own checkpoints made in Phase 13
# (/data4/muthangiv/askiisc/models/<key>); they do not exist yet.
qwen3-4b-instruct-2507:
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
  served_name: qwen3-4b-instruct-2507
  family: qwen3
  size_class: 4B
  dtype: bfloat16
  quantization: null
gemma-3-4b-it:
  hf_repo: google/gemma-3-4b-it
  served_name: gemma-3-4b-it
  family: gemma3
  size_class: 4B
  dtype: bfloat16
  quantization: null
  gated: true
