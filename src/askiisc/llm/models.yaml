# The six FR-8 models (two each of 4B, 8B and 4-bit 8B). ASKIISC_MODEL
# selects one by key.
# served_name is what vLLM is started with (--served-model-name) and what the
# client sends; hf_repo is what slurm/fetch_models.sh downloads.
# The PRD's nine included Gemma-3-4B and Llama-3.1-8B, which need an
# accepted licence and a HuggingFace token; they were dropped on 2026-11-02.
# The two 4-bit models are published checkpoints of the two 8B models (so
# FR-8 can compare each with its parent): Qwen's own AWQ build, and a
# community GPTQ build of Granite-3.3-8B (IBM publishes none). The drawais
# AWQ build was dropped on 2026-11-03: on ~4k-token RAG prompts it produced
# gibberish under vLLM 0.11 (every quality answer became a refusal).
qwen3-4b-instruct-2507:
  hf_repo: Qwen/Qwen3-4B-Instruct-2507
  served_name: qwen3-4b-instruct-2507
  family: qwen3
  size_class: 4B
  dtype: bfloat16
  quantization: null
phi-4-mini-instruct:
  hf_repo: microsoft/Phi-4-mini-instruct
  served_name: phi-4-mini-instruct
  family: phi4
  size_class: 4B
  dtype: bfloat16
  quantization: null
qwen3-8b:
  hf_repo: Qwen/Qwen3-8B
  served_name: qwen3-8b
  family: qwen3
  size_class: 8B
  dtype: bfloat16
  quantization: null
  chat_template_kwargs:
    enable_thinking: false
granite-3.3-8b-instruct:
  hf_repo: ibm-granite/granite-3.3-8b-instruct
  served_name: granite-3.3-8b-instruct
  family: granite
  size_class: 8B
  dtype: bfloat16
  quantization: null
qwen3-8b-awq:
  hf_repo: Qwen/Qwen3-8B-AWQ
  served_name: qwen3-8b-awq
  family: qwen3
  size_class: 8B-AWQ
  dtype: float16
  quantization: awq
  chat_template_kwargs:
    enable_thinking: false
granite-3.3-8b-instruct-gptq:
  hf_repo: TevunahAi/Granite-3.3-8B-Instruct-GPTQ
  served_name: granite-3.3-8b-instruct-gptq
  family: granite
  size_class: 8B-AWQ
  dtype: float16
  quantization: gptq_marlin
