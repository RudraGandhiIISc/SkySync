[project]
name = "askiisc"
version = "0.1.0"
description = "Ask IISc: multi-tenant RAG over versioned IISc documents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "pymilvus>=2.5,<3.1",
    "milvus-lite>=2.4.10",
    "pypdf>=4.3",
    "beautifulsoup4>=4.12",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "locust>=2.31",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askiisc"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests", "eval", "tools", "deploy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "D", "PL"]
ignore = [
    "PLR0913",  # constructors take injected dependencies
    "PLR0917",  # same, positionally
    "PLR0911",  # access decisions read best as early returns
    "D105",     # magic methods are self-describing
    "D107",     # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "D", "PLR2004", "PLC0415"]
"eval/**" = ["S311", "PLR2004"]
"deploy/**" = ["S311"]
"tools/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["askiisc"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "milvus_lite.*", "pynvml.*", "locust.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
faulthandler_timeout = 300
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast hermetic tests (default)",
    "integration: real service binaries (redis-server on PATH)",
    "e2e: full stack with the fake LLM",
    "perf: performance thresholds",
    "security: security suites",
    "regress: golden-file regression tests",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["askiisc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests"]
